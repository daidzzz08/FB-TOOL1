name: Build Windows EXE

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Build Script
        run: |
          python build_exe.py

      - name: Create Data & Uploads folders in dist
        run: |
          if not exist dist\FB_Auto_Poster\data mkdir dist\FB_Auto_Poster\data
          if not exist dist\FB_Auto_Poster\uploads mkdir dist\FB_Auto_Poster\uploads

      - name: Upload Artifact (ZIP chứa file EXE)
        uses: actions/upload-artifact@v4
        with:
          name: FB_Auto_Poster_Windows
          path: dist/FB_Auto_Poster/
