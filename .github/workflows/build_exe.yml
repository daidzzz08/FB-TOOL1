name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Build Script
        run: |
          python build_exe.py

      - name: Create Data and Uploads folders in dist
        run: |
          if (!(Test-Path -Path "dist\FB_Auto_Poster\data")) { New-Item -ItemType Directory -Path "dist\FB_Auto_Poster\data" }
          if (!(Test-Path -Path "dist\FB_Auto_Poster\uploads")) { New-Item -ItemType Directory -Path "dist\FB_Auto_Poster\uploads" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FB_Auto_Poster_Windows
          path: dist/FB_Auto_Poster/
